---
- name: Create Protection Group for Individual Computers
  hosts: veeam_server
  gather_facts: false
  vars_files:
    - ../vars/veeam_config.yml
    - ../vars/targets.yml

  tasks:
    - name: Create protection group script
      ansible.windows.win_copy:
        dest: "C:\\Temp\\create_pg_{{ item.hostname }}.ps1"
        content: |
          $ErrorActionPreference = 'Stop'
          try {
            Import-Module Veeam.Backup.PowerShell

            $existing = Get-VBRProtectionGroup -Name "{{ item.protection_group.name }}" -ErrorAction SilentlyContinue
            if ($existing) {
              Write-Output "Protection group already exists"
              exit 0
            }

            $cred = New-VBRIndividualComputerCustomCredentials `
              -HostName "{{ item.ip_address }}" `
              -UseTemporaryCertificate

            $container = New-VBRIndividualComputerContainer `
              -CustomCredentials $cred

            $result = Add-VBRProtectionGroup `
              -Name "{{ item.protection_group.name }}" `
              -Container $container

            $result | Format-List *
            Write-Output "Protection group created"
            exit 0
          }
          catch {
            Write-Error "FAILED: $($_.Exception.Message)"
            Write-Error "$($_.ScriptStackTrace)"
            exit 1
          }
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Create protection group for each target
      ansible.windows.win_shell: |
        & "C:\Program Files\PowerShell\7\pwsh.exe" `
          -NoProfile `
          -ExecutionPolicy Bypass `
          -File "C:\Temp\create_pg_{{ item.hostname }}.ps1"
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.hostname }}"
      register: pg_create
      failed_when: pg_create.rc != 0

    - name: Display protection group creation stdout
      ansible.builtin.debug:
        var: pg_create.results | map(attribute='stdout_lines') | list

    - name: Display protection group creation stderr
      ansible.builtin.debug:
        var: pg_create.results | map(attribute='stderr_lines') | list

    - name: Create rescan script
      ansible.windows.win_copy:
        dest: "C:\\Temp\\rescan_pg_{{ item.hostname }}.ps1"
        content: |
          $ErrorActionPreference = 'Stop'
          try {
            Import-Module Veeam.Backup.PowerShell
            $group = Get-VBRProtectionGroup -Name "{{ item.protection_group.name }}" -ErrorAction Stop
            Rescan-VBREntity -Entity $group
            Write-Output "Rescan triggered"
            exit 0
          }
          catch {
            Write-Error "FAILED: $($_.Exception.Message)"
            exit 1
          }
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Rescan protection group
      ansible.windows.win_shell: |
        & "C:\Program Files\PowerShell\7\pwsh.exe" `
          -NoProfile `
          -ExecutionPolicy Bypass `
          -File "C:\Temp\rescan_pg_{{ item.hostname }}.ps1"
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.hostname }}"
      register: pg_rescan
      failed_when: false

    - name: Display rescan stdout
      ansible.builtin.debug:
        var: pg_rescan.results | map(attribute='stdout_lines') | list

    - name: Display rescan stderr
      ansible.builtin.debug:
        var: pg_rescan.results | map(attribute='stderr_lines') | list

    - name: Confirm protection groups exist
      ansible.windows.win_shell: |
        & "C:\Program Files\PowerShell\7\pwsh.exe" `
          -NoProfile `
          -Command "Import-Module Veeam.Backup.PowerShell; Get-VBRProtectionGroup | Select-Object Name, Type"
      register: pg_confirm

    - name: Display all protection groups on the server
      ansible.builtin.debug:
        var: pg_confirm.stdout_lines
