---
- name: Install Veeam Backup and Replication
  hosts: all
  gather_facts: false

  vars_files:
    - ../vars/veeam_config.yml

  tasks:

    - name: Create Temp directory
      win_file:
        path: C:\Temp
        state: directory

    - name: Create Veeam log directory
      win_file:
        path: "{{ vbr.log_folder }}"
        state: directory

    - name: Generate VBR Answer File
      win_template:
        src: ../templates/vbr_answerfile.xml.j2
        dest: "{{ vbr.answer_file }}"

    - name: Verify Veeam Silent Installer Exists
      win_stat:
        path: "{{ vbr.silent_installer }}"
      register: veeam_installer

    - name: Fail if Veeam Silent Installer Missing
      fail:
        msg: "Veeam silent installer not found at {{ vbr.silent_installer }}"
      when: not veeam_installer.stat.exists

    - name: Start Veeam Silent Installation
      win_shell: |
        cd "C:\Veeam\Veeam\Setup\Silent"
        .\Veeam.Silent.Install.exe /AnswerFile "{{ vbr.answer_file }}" /LogFolder "{{ vbr.log_folder }}"
      register: veeam_install
      failed_when: false

    - name: Display installation return code
      debug:
        var: veeam_install.rc

    - name: Display installation stdout
      debug:
        var: veeam_install.stdout

    - name: Display installation stderr
      debug:
        var: veeam_install.stderr

    - name: Check Veeam Backup Service
      win_shell: |
        Get-Service VeeamBackupSvc
      register: veeam_service
      failed_when: false

    - name: Display Veeam service information
      debug:
        var: veeam_service.stdout
