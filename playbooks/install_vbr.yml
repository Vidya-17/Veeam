---
- name: Install Veeam Backup and Replication
  hosts: all
  gather_facts: false

  vars_files:
    - ../vars/veeam_config.yml

  tasks:

    - name: Create Temp directory
      win_file:
        path: C:\Temp
        state: directory

    - name: Create Veeam log directory
      win_file:
        path: "{{ vbr.log_folder }}"
        state: directory

    - name: Generate VBR Answer File
      win_template:
        src: ../templates/vbr_answerfile.xml.j2
        dest: "{{ vbr.answer_file }}"

    - name: Verify Veeam Silent Installer Exists
      win_stat:
        path: "{{ vbr.silent_installer }}"
      register: veeam_installer

    - name: Fail if Veeam Silent Installer Missing
      fail:
        msg: "Veeam silent installer not found at {{ vbr.silent_installer }}"
      when: not veeam_installer.stat.exists

    - name: Check pending reboot keys
      win_shell: |
        $result = @()

        if (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending") {
          $result += "CBS RebootPending"
        }

        if (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired") {
          $result += "WindowsUpdate RebootRequired"
        }

        $result
      register: reboot_check
      failed_when: false

    - name: Display reboot status
      debug:
        var: reboot_check.stdout

    - name: Create installer working folder
      win_file:
        path: C:\VeeamLogs
        state: directory

    - name: Start Veeam Silent Installation
      win_shell: |
        & "{{ vbr.silent_installer }}" `
          /AnswerFile "{{ vbr.answer_file }}" `
          /LogFolder "C:\VeeamLogs"
      register: veeam_install
      failed_when: false

    - name: Display installation return code
      debug:
        var: veeam_install.rc

    - name: Display installation stdout
      debug:
        var: veeam_install.stdout

    - name: Display installation stderr
      debug:
        var: veeam_install.stderr

    - name: Show Veeam log folder contents
      win_shell: |
        Get-ChildItem C:\VeeamLogs -Recurse -Force
      register: veeam_logs
      failed_when: false

    - name: Display Veeam log files
      debug:
        var: veeam_logs.stdout

    - name: Read latest unattended installation result
      win_shell: |
        $file = Get-ChildItem C:\VeeamLogs\UnattendedInstallationResult*.xml |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1

        if ($file) {
          Get-Content $file.FullName -Raw
        }
      register: unattended_result
      failed_when: false

    - name: Display unattended installation result
      debug:
        var: unattended_result.stdout

    - name: Show ProgramData Veeam files
      win_shell: |
        Get-ChildItem "C:\ProgramData" -Recurse -Force -ErrorAction SilentlyContinue |
        Where-Object {$_.FullName -match "Veeam"}
      register: veeam_programdata
      failed_when: false

    - name: Display ProgramData Veeam files
      debug:
        var: veeam_programdata.stdout

    - name: Check Veeam services
      win_shell: |
        Get-Service *Veeam*
      register: veeam_service
      failed_when: false

    - name: Display Veeam service information
      debug:
        var: veeam_service.stdout

    - name: Fail if Veeam installation returned error
      fail:
        msg: |
          Veeam installation failed.
          Return code: {{ veeam_install.rc }}
          StdErr: {{ veeam_install.stderr
