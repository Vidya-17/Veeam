---
- name: Install Veeam Backup and Replication
  hosts: all
  gather_facts: false

  vars_files:
    - ../vars/veeam_config.yml

  tasks:

    - name: Create Temp directory
      win_file:
        path: C:\Temp
        state: directory

    - name: Create Veeam log directory
      win_file:
        path: "{{ vbr.log_folder }}"
        state: directory

    - name: Generate VBR Answer File
      win_template:
        src: ../templates/vbr_answerfile.xml.j2
        dest: "{{ vbr.answer_file }}"

    - name: Verify Veeam Silent Installer Exists
      win_stat:
        path: "{{ vbr.silent_installer }}"
      register: veeam_installer

    - name: Fail if Veeam Silent Installer Missing
      fail:
        msg: "Veeam silent installer not found at {{ vbr.silent_installer }}"
      when: not veeam_installer.stat.exists

    - name: Create installer working folder
      win_file:
        path: C:\VeeamLogs
        state: directory

    - name: Create scheduled task for Veeam installation
      win_scheduled_task:
        name: VeeamInstall
        username: SYSTEM
        run_level: highest
        actions:
          - path: "{{ vbr.silent_installer }}"
            arguments: '/AnswerFile "{{ vbr.answer_file }}" /LogFolder C:\VeeamLogs'
        triggers: []
        state: present

    - name: Run scheduled task
      win_shell: |
        schtasks /Run /TN "VeeamInstall"
      failed_when: false

    - name: Wait for Veeam installation
      pause:
        minutes: 5

    - name: Show Veeam log folder contents
      win_shell: |
        Get-ChildItem C:\VeeamLogs -Recurse -Force
      register: veeam_logs
      failed_when: false

    - name: Display Veeam log files
      debug:
        var: veeam_logs.stdout

    - name: Read unattended installation result
      win_shell: |
        Get-Content C:\VeeamLogs\UnattendedInstallationResult*.xml -Raw
      register: unattended_result
      failed_when: false

    - name: Display unattended installation result
      debug:
        var: unattended_result.stdout

    - name: Check Veeam services
