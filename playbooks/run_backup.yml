---
- name: Run Windows Computer Backup Job (Active Full)
  hosts: veeam_server
  gather_facts: false
  vars_files:
    - ../vars/veeam_config.yml
    - ../vars/targets.yml

  tasks:
    - name: Create start-job script
      ansible.windows.win_copy:
        dest: "C:\\Temp\\start_job_{{ item.hostname }}.ps1"
        content: |
          $ErrorActionPreference = 'Stop'
          try {
            Import-Module Veeam.Backup.PowerShell
            $job = Get-VBRComputerBackupJob -Name "{{ item.backup_job.name }}" -ErrorAction Stop

            # -FullBackup forces an Active Full run. If this parameter name
            # doesn't match your build, run:
            #   & "C:\Program Files\PowerShell\7\pwsh.exe" -Command "Import-Module Veeam.Backup.PowerShell; Get-Help Start-VBRComputerBackupJob -Full"
            # on the VBR server to confirm the exact switch name.
            Start-VBRComputerBackupJob -Job $job -FullBackup

            Write-Output "Active full backup started"
            exit 0
          }
          catch {
            Write-Error "FAILED: $($_.Exception.Message)"
            Write-Error "$($_.ScriptStackTrace)"
            exit 1
          }
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.hostname }}"
      when: item.backup_job.run_after_create | default(false)

    - name: Run start-job script (PowerShell 7 required for v13 module)
      ansible.windows.win_shell: |
        & "C:\Program Files\PowerShell\7\pwsh.exe" `
          -NoProfile `
          -ExecutionPolicy Bypass `
          -File "C:\Temp\start_job_{{ item.hostname }}.ps1"
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.hostname }}"
      when: item.backup_job.run_after_create | default(false)
      register: job_start
      failed_when: false

    - name: Display job start stdout
      ansible.builtin.debug:
        var: job_start.results | map(attribute='stdout_lines') | list
      when: job_start.results is defined

    - name: Display job start stderr
      ansible.builtin.debug:
        var: job_start.results | map(attribute='stderr_lines') | list
      when: job_start.results is defined

    - name: Check current job session status
      ansible.windows.win_shell: |
        & "C:\Program Files\PowerShell\7\pwsh.exe" `
          -NoProfile `
          -Command "Import-Module Veeam.Backup.PowerShell; Get-VBRBackupSession | Where-Object { `$_.JobName -eq '{{ item.backup_job.name }}' } | Sort-Object CreationTime -Descending | Select-Object -First 1 | Select-Object JobName, State, Result, Progress"
      loop: "{{ targets }}"
      loop_control:
        label: "{{ item.hostname }}"
      register: job_status

    - name: Display job session status
      ansible.builtin.debug:
        var: job_status.results | map(attribute='stdout_lines') | list
