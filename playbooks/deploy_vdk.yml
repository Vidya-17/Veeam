---
# Step 1: Generate the Veeam Deployment Kit ON THE VBR SERVER.
# Confirmed available on your build (Veeam.Backup.PowerShell 13.1.0.411) —
# the earlier "not recognized" error was just a session that hadn't
# imported the module, not an edition restriction.
- name: Generate Veeam Deployment Kit on Veeam server
  hosts: veeam_server
  gather_facts: false
  vars_files:
    - ../vars/veeam_config.yml

  tasks:
    - name: Create export folder for VDK on VBR server
      ansible.windows.win_file:
        path: "{{ vbr.vdk_export_path }}"
        state: directory

    - name: Generate Veeam Deployment Kit
      ansible.windows.win_shell: |
        & "C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -Command "
        Import-Module Veeam.Backup.PowerShell;
        Generate-VBRBackupServerDeployerKit `
          -ExportPath '{{ vbr.vdk_export_path }}' `
          -AllPlatforms `
          -ValidityPeriodInHours {{ vbr.vdk_validity_hours }}"
      register: vdk_generate
      failed_when: vdk_generate.rc != 0

    - name: Show generated VDK files
      ansible.windows.win_shell: |
        Get-ChildItem "{{ vbr.vdk_export_path }}" -Recurse | Select-Object FullName
      register: vdk_files

    - name: Display generated VDK files
      ansible.builtin.debug:
        var: vdk_files.stdout_lines

    # Pull the generated kit down to the Ansible controller so it can be
    # pushed out to any target machine in the next play.
    - name: Fetch VDK folder to controller
      ansible.windows.win_shell: |
        Compress-Archive -Path "{{ vbr.vdk_export_path }}\*" -DestinationPath "{{ vbr.vdk_export_path }}.zip" -Force
      register: vdk_zip

    - name: Fetch the zipped VDK to the Ansible controller
      ansible.builtin.fetch:
        src: "{{ vbr.vdk_export_path }}.zip"
        dest: "./staging/vdk_kit.zip"
        flat: true
