---
# Step 1: Generate the Veeam Deployment Kit ON THE VBR SERVER

- name: Generate Veeam Deployment Kit on Veeam server
  hosts: veeam_server
  gather_facts: false
  vars_files:
    - ../vars/veeam_config.yml

  tasks:

    - name: Create export folder for VDK on VBR server
      ansible.windows.win_file:
        path: "{{ vbr.vdk_export_path }}"
        state: directory

    - name: Ensure Veeam Reverse Proxy Service is running
      ansible.windows.win_service:
        name: VeeamReverseProxySvc
        state: started

    - name: Create PowerShell script for VDK generation
      ansible.windows.win_copy:
        dest: C:\Temp\generate_vdk.ps1
        content: |
          Import-Module Veeam.Backup.PowerShell

          Generate-VBRBackupServerDeployerKit `
            -ExportPath "{{ vbr.vdk_export_path }}" `
            -AllPlatforms `
            -ValidityPeriodInHours {{ vbr.vdk_validity_hours }}

    - name: Generate Veeam Deployment Kit
      ansible.windows.win_shell: |
        & "C:\Program Files\PowerShell\7\pwsh.exe" `
          -NoProfile `
          -ExecutionPolicy Bypass `
          -File C:\Temp\generate_vdk.ps1
      register: vdk_generate
      failed_when: vdk_generate.rc != 0

    - name: Display VDK generation output
      ansible.builtin.debug:
        var: vdk_generate.stdout_lines

    - name: Display VDK generation errors
      ansible.builtin.debug:
        var: vdk_generate.stderr_lines
      when: vdk_generate.stderr | default('') | length > 0

    - name: Show generated VDK files
      ansible.windows.win_shell: |
        Get-ChildItem "{{ vbr.vdk_export_path }}" -Recurse |
          Select-Object FullName
      register: vdk_files

    - name: Display generated VDK files
      ansible.builtin.debug:
        var: vdk_files.stdout_lines

    - name: Create ZIP archive of generated VDK
      ansible.windows.win_shell: |
        Compress-Archive `
          -Path "{{ vbr.vdk_export_path }}\*" `
          -DestinationPath "{{ vbr.vdk_export_path }}.zip" `
          -Force
      register: vdk_zip

    - name: Fetch the zipped VDK to the Ansible controller
      ansible.builtin.fetch:
        src: "{{ vbr.vdk_export_path }}.zip"
        dest: "./staging/vdk_kit.zip"
        flat: true
