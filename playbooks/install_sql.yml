---
- name: Install SQL Server
  hosts: all
  gather_facts: false

  vars_files:
    - ../vars/veeam_config.yml

  tasks:

    - name: Verify SQL installer exists
      win_stat:
        path: "{{ sql.installer_path }}"
      register: sql_installer

    - name: Fail if SQL installer not found
      fail:
        msg: "SQL installer not found at {{ sql.installer_path }}"
      when: not sql_installer.stat.exists

    - name: Install SQL Server Express
      win_shell: |
        "{{ sql.installer_path }}" /Q /ACTION=Install /FEATURES=SQLENGINE /INSTANCENAME={{ sql.instance_name }} /INSTANCEID={{ sql.instance_id }} /TCPENABLED=1 /IACCEPTSQLSERVERLICENSETERMS

    - name: Set SQL Browser startup type to automatic
      win_service:
        name: "{{ sql.sql_browser_service }}"
        start_mode: auto

    - name: Start SQL Browser service
      win_service:
        name: "{{ sql.sql_browser_service }}"
        state: started

    - name: Restart SQL Service
      win_service:
        name: "{{ sql.sql_service_name }}"
        state: restarted
      failed_when: false

    - name: Add SYSTEM account as sysadmin
      win_shell: |
        sqlcmd -S localhost\{{ sql.instance_name }} -E -Q "EXEC sp_addsrvrolemember 'NT AUTHORITY\SYSTEM','sysadmin'"
      failed_when: false

    - name: Verify SYSTEM sysadmin role
      win_shell: |
        sqlcmd -S localhost\{{ sql.instance_name }} -E -Q "SELECT IS_SRVROLEMEMBER('sysadmin','NT AUTHORITY\SYSTEM')"
      register: sql_verify

    - name: Show verification result
      debug:
        var: sql_verify.stdout
``
